<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>EZ_UIU | Student Academic Intelligence Suite</title>
    <meta name="description" content="Official UIU academic intelligence suite: retake-aware CGPA calculator, tuition waiver engine, and clash-free routine solver with .ics calendar sync." />
    <meta name="theme-color" content="#5b5bd6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Pre-hydration theme initialization to prevent flash -->
    <script>
      try {
        var saved = localStorage.getItem('ez_uiu_theme');
        var isDark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
        }
      } catch (e) {}
    </script>
    <script type="module" crossorigin src="./assets/main-D6XFsFDJ.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/main-xlGCgh7V.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
